minimum_pre_commit_version: "4.6.2"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and safe fixes
        entry: uv run --extra dev ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --extra dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
