[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audio-processing-cli"
version = "0.1.0"
description = "Profile-driven, local-first audio enhancement for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fred Yang" }]
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "scipy>=1.14",
  # `audio packages pull` materializes Hub revisions, including one for the swift environment
  # that has no interpreter of its own to download with. Imported lazily, so the rest of the
  # tool works without it and `audio doctor` reports its absence.
  "huggingface-hub>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[project.scripts]
audio = "audio_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/.agents/skills/auto-enhancement",
  "/.agents/skills/model-packages",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: exercises downloaded models and real media",
]
