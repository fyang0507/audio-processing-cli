[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audio-processing-cli"
version = "0.1.0"
description = "Profile-driven, local-first audio enhancement for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fred Yang" }]
dependencies = [
  "numpy>=2.0",
  "onnxruntime>=1.20",
  "scipy>=1.14",
  # `audio packages pull` materializes Hub revisions, including one for the swift environment
  # that has no interpreter of its own to download with. Imported lazily, so the rest of the
  # tool works without it and `audio doctor` reports its absence.
  "huggingface-hub>=0.34",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.6.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff==0.16.6",
]

[project.scripts]
audio = "audio_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/.agents/skills/audio-cli",
  "/.pre-commit-config.yaml",
  "/*.md",
  "/docs",
  "/model_tests/benchmark",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
]

exclude = ["/tests/artifacts/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "live: exercises downloaded models and real media",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
external = ["ANN", "BLE", "PLC"]
select = [
  "B",
  "C4",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PIE",
  "RUF",
  "SIM",
  "UP",
]
ignore = [
  # Chinese punctuation and smart quotes are data in multilingual fixtures.
  "RUF001",
]
